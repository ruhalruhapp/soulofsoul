# Render Blueprint for soulofsoul
services:
  - type: pserv
    name: soulofsoul-db
    region: oregon
    plan: free
    ipAllowList: []
    envVars:
      - key: POSTGRES_USER
        value: soulofsoul
      - key: POSTGRES_DB
        value: soulofsoul

  - type: web
    name: soulofsoul
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soulofsoul-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://soulofsoul.onrender.com
      - key: NODE_ENV
        value: production
