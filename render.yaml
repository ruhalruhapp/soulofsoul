# Render Blueprint for soulofsoul
# Uses Convex DB — no PostgreSQL service needed.

services:
  - type: web
    name: soulofsoul
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CONVEX_URL
        sync: false  # set via Render dashboard or API
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://soulofsoul.onrender.com
      - key: NODE_ENV
        value: production
