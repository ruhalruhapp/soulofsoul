# Render Blueprint for soulofsoul
# Uses Convex DB — no PostgreSQL service needed.
# Click this link to deploy: https://dashboard.render.com/deploy?repo=https://github.com/ruhalruhapp/soulofsoul

services:
  - type: web
    name: soulofsoul
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CONVEX_URL
        value: https://cautious-ostrich-558.eu-west-1.convex.cloud
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://soulofsoul.onrender.com
      - key: NODE_ENV
        value: production
