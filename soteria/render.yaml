# Render Blueprint for Soteria Dialogue
# This file defines the infrastructure for Render to provision.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── PostgreSQL Database ───
  - type: pserv
    name: soteria-db
    region: oregon
    plan: free  # upgrade to starter for production
    ipAllowList: []  # only allow connections from Render services
    env:
      - key: POSTGRES_USER
        value: soteria
      - key: POSTGRES_PASSWORD
        sync: false  # set via Render dashboard or API
      - key: POSTGRES_DB
        value: soteria

  # ─── Web Service (Next.js app) ───
  - type: web
    name: soteria-dialogue
    region: oregon
    plan: free  # upgrade to starter for production
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soteria-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://soteria-dialogue.onrender.com
      - key: NODE_ENV
        value: production
